<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#22d3ee" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Outer Soundwaves -->
  <circle cx="256" cy="235" r="170" fill="none" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="235" r="140" fill="none" stroke="#22d3ee" stroke-width="5" stroke-opacity="0.25"/>
  
  <!-- Central Badge Glow -->
  <circle cx="256" cy="235" r="105" fill="#083344" stroke="url(#cyanGrad)" stroke-width="8"/>
  
  <!-- Chinese Hanzi "语" or "学" (Learning / Language) -->
  <text x="256" y="270" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="115" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">文</text>
  
  <!-- Audio Wave / Speaker Icon Badge -->
  <circle cx="350" cy="140" r="38" fill="#06b6d4" stroke="#ffffff" stroke-width="4"/>
  <path d="M338 132 L346 132 L356 124 L356 156 L346 148 L338 148 Z" fill="#0f172a"/>
  <path d="M362 134 C366 138 366 142 362 146" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- App Title Banner -->
  <rect x="76" y="380" width="360" height="74" rx="22" fill="#06b6d4"/>
  <text x="256" y="428" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">MANDARINNOW</text>
</svg>
